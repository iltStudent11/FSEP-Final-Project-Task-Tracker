# Template only — placeholder values, safe to commit. Real values must never
# be committed to git. Populate the live Secret one of two ways:
#
#   1. Imperatively from backend-api/.env (recommended for local/dev clusters):
#        kubectl create secret generic policy-claims-secrets \
#          --namespace policy-claims \
#          --from-literal=PORT=3000 \
#          --from-literal=NODE_ENV=production \
#          --from-literal=JWT_SECRET="$(grep -oP '(?<=^JWT_SECRET=).*' backend-api/.env | tr -d '"')" \
#          --from-literal=MONGODB_URI="mongodb://mongo.policy-claims.svc.cluster.local:27017/policy-claims" \
#          --dry-run=client -o yaml | kubectl apply -f -
#
#   2. Edit a copy of this file with real values (base64: `echo -n '<value>' | base64`)
#      and `kubectl apply -f` it — keep that copy out of git.
#
# PORT/NODE_ENV aren't sensitive, but api.yaml's Deployment loads all four
# vars via envFrom: secretRef against this one Secret, so they live here too.
apiVersion: v1
kind: Secret
metadata:
  name: policy-claims-secrets
  namespace: policy-claims
type: Opaque
stringData:
  PORT: "3000"
  NODE_ENV: "production"
  JWT_SECRET: "REPLACE_ME"
  MONGODB_URI: "mongodb://mongo.policy-claims.svc.cluster.local:27017/policy-claims"
