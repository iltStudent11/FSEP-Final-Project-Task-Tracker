apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: policy-claims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: p3-capstone-client:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: API_UPSTREAM
              value: api.policy-claims.svc.cluster.local:3000
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: policy-claims
spec:
  type: NodePort
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
