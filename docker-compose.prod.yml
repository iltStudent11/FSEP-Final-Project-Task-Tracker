services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  api:
    build: ./backend-api
    environment:
      MONGODB_URI: mongodb://mongo:27017/policy-claims
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 3000
    depends_on:
      - mongo
    restart: unless-stopped

  client:
    build: ./frontend-client
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./frontend-client/nginx-ssl.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
