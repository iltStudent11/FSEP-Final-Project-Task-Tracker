<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | default: "Documentation" }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #24292f;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    h1, h2, h3 { line-height: 1.25; }
    h1, h2 { border-bottom: 1px solid #d0d7de; padding-bottom: .3em; }
    a { color: #0969da; }
    code { background: #f6f8fa; padding: .2em .4em; border-radius: 6px; font-size: 85%; }
    pre code { background: none; padding: 0; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow: auto; }
    blockquote { color: #57606a; border-left: .25em solid #d0d7de; padding: 0 1em; margin-left: 0; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #d0d7de; padding: 6px 13px; }
    .mermaid { background: none; padding: 0; text-align: center; }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    // Jekyll/Rouge renders ```mermaid fences as a plain highlighted code block,
    // not a diagram. Rewrite those blocks into <pre class="mermaid"> so Mermaid
    // can render them, then run Mermaid.
    document.querySelectorAll(
      'div.language-mermaid, code.language-mermaid, pre > code.language-mermaid'
    ).forEach((el) => {
      const block = el.closest('div.language-mermaid') || el;
      const source = block.textContent;
      const target = document.createElement('pre');
      target.className = 'mermaid';
      target.textContent = source;
      block.replaceWith(target);
    });

    mermaid.initialize({ startOnLoad: false });
    await mermaid.run({ querySelector: '.mermaid' });
  </script>
</body>
</html>
