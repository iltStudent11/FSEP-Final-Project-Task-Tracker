name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do not cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Keep the documentation link in README.md pointing at the freshly-deployed
  # Pages URL. Commits back to main only when the link actually changed (the URL
  # is stable, so this is usually a no-op). [skip ci] avoids re-triggering CI on
  # the docs commit; this workflow itself is not re-triggered because it only
  # watches docs/** and pages.yml, not README.md.
  update-readme:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Refresh Pages link in README
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python3 - "$PAGE_URL" <<'PY'
          import re, sys, pathlib
          url = sys.argv[1].rstrip('/') + '/'
          block = (
              '<!-- PAGES-LINK:START -->\n'
              f'📖 **[Documentation site]({url})** — architecture & design docs, '
              'published from `docs/` via GitHub Pages.\n'
              '<!-- PAGES-LINK:END -->'
          )
          p = pathlib.Path('README.md')
          text = p.read_text(encoding='utf-8')
          new = re.sub(
              r'<!-- PAGES-LINK:START -->.*?<!-- PAGES-LINK:END -->',
              lambda _m: block, text, flags=re.S,
          )
          p.write_text(new, encoding='utf-8')
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README Pages link already current — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh GitHub Pages link in README [skip ci]"
          git push
