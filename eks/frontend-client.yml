apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-client
  namespace: policy-claims
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-client
  template:
    metadata:
      labels:
        app: frontend-client
    spec:
      containers:
        - name: client
          image: 717279729058.dkr.ecr.us-east-1.amazonaws.com/fsep-cap3-frontend-client:1.0
          imagePullPolicy: Always
          # nginx in this image always listens on 80 (see
          # frontend-client/Dockerfile's EXPOSE 80) — PORT/NODE_ENV have no
          # effect on it and are not set here.
          ports:
            - containerPort: 80
          env:
            # Overrides the image's Compose-oriented default (api:3000, see
            # frontend-client/Dockerfile's ENV API_UPSTREAM) so nginx's
            # /api/ proxy resolves to the real Service in this cluster.
            - name: API_UPSTREAM
              value: backend-api-svc.policy-claims.svc.cluster.local:3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-client-svc
  namespace: policy-claims
spec:
  selector:
    app: frontend-client
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
