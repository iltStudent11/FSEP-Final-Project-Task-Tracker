# Template only — placeholder values, safe to commit. Real values must never
# be committed to git. Populate the live Secret imperatively instead:
#
#   kubectl create secret generic policy-claims-secrets \
#     --namespace policy-claims \
#     --from-literal=PORT=3000 \
#     --from-literal=NODE_ENV=production \
#     --from-literal=JWT_SECRET="<a real secret, not the one in backend-api/.env>" \
#     --from-literal=MONGODB_URI="mongodb://mongo-svc.policy-claims.svc.cluster.local:27017/policy-claims" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# backend-api.yml's Deployment loads all four vars via envFrom: secretRef
# against this one Secret.
apiVersion: v1
kind: Secret
metadata:
  name: policy-claims-secrets
  namespace: policy-claims
type: Opaque
stringData:
  PORT: "3000"
  NODE_ENV: "production"
  JWT_SECRET: "REPLACE_ME"
  MONGODB_URI: "mongodb://mongo-svc.policy-claims.svc.cluster.local:27017/policy-claims"
