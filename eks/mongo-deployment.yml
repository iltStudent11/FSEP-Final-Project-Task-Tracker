apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: policy-claims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      # emptyDir: fine for a quick demo, but all data is lost whenever this
      # pod restarts or is rescheduled — use a PVC instead if that matters.
      volumes:
        - name: mongo-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-svc
  namespace: policy-claims
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
